# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # ============================================================================
  # GENERAL REPOSITORY & HYGIENE CHECKS
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^(\.github/|terraform/)
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # ============================================================================
  # GO / API CODE CHECKS (Monorepo & Subdirectory Module-Aware)
  # ============================================================================
  - repo: local
    hooks:
      - id: go-fmt
        name: go-fmt
        entry: go -C src/backend fmt ./...
        language: golang
        language_version: '1.26.0'
        files: ^src/backend/
        pass_filenames: false

      - id: go-vet
        name: go-vet
        entry: go -C src/backend vet ./...
        language: golang
        language_version: '1.26.0'
        files: ^src/backend/
        pass_filenames: false


  # ============================================================================
  # FRONTEND / UI CODE CHECKS (Prettier for TS, TSX, JS, CSS)
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, markdown]
        files: ^(src/frontend/|docs/)
