name: ew101-c1-persistence

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${EWASTE_DB_NAME:-ewaste}
      MYSQL_USER: ${EWASTE_DB_USER:-ewaste_app}
      MYSQL_PASSWORD: ${EWASTE_DB_PASSWORD:-ewaste-local-only}
      MYSQL_ROOT_PASSWORD: ${EWASTE_DB_ROOT_PASSWORD:-root-local-only}
      TZ: UTC
    ports:
      - "${EWASTE_DB_PORT:-3307}:3306"
    volumes:
      - ew101_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  liquibase:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /liquibase/changelog
    volumes:
      - ./:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:mysql://mysql:3306/${EWASTE_DB_NAME:-ewaste}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      LIQUIBASE_COMMAND_USERNAME: ${EWASTE_DB_USER:-ewaste_app}
      LIQUIBASE_COMMAND_PASSWORD: ${EWASTE_DB_PASSWORD:-ewaste-local-only}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog

volumes:
  ew101_mysql_data:
