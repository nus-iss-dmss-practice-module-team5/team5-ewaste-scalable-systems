name: Database - Liquibase Migration

on:
  workflow_run:
    workflows: ["IaC - Create Cloud Resources (Dev, Stg, Prod)"]
    types:
      - completed
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - 'database/**'
      - '.github/workflows/database-migration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/database-migration.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Azure Runtime Environment (dev, stg, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod
      command:
        description: 'Liquibase command to run'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - status
          - validate

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: liquibase-migration-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STAGE 0: ENVIRONMENT RESOLUTION, DB EXISTENCE CHECK
  # ============================================================================
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      environment: ${{ steps.env_resolver.outputs.environment }}
      is_production: ${{ steps.env_resolver.outputs.is_production }}
    steps:
      - name: Download Target Environment from Infrastructure Workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deployment-environment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .environment
        continue-on-error: true

      # ------------------------------------------------------------------------
      # QUEUE GUARD: Wait for in-progress Terraform workflows to prevent collision
      # ------------------------------------------------------------------------
      - name: Wait for Active Upstream Terraform Pipeline
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "=========================================================="
          echo " Checking for running Terraform pipelines on $REF_NAME..."
          echo "=========================================================="

          MAX_WAIT=900
          WAITED=0
          INTERVAL=15

          while [ $WAITED -lt $MAX_WAIT ]; do
            ACTIVE_TF=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "IaC - Create Cloud Resources (Dev, Stg, Prod)" \
              --branch "$REF_NAME" \
              --json databaseId,status \
              --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' 2>/dev/null || echo "")

            if [ -z "$ACTIVE_TF" ]; then
              echo "No active Terraform pipelines running."
              break
            fi

            echo "Active Terraform pipeline detected: $ACTIVE_TF"
            echo "Queuing up and waiting $INTERVAL seconds (elapsed: ${WAITED}s)..."
            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "::error::Timed out after $MAX_WAIT seconds waiting for Terraform pipeline to complete."
            exit 1
          fi

          LATEST_TF_STATUS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "IaC - Create Cloud Resources (Dev, Stg, Prod)" \
            --branch "$REF_NAME" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"' 2>/dev/null || echo "none")

          if [ "$LATEST_TF_STATUS" == "failure" ] || [ "$LATEST_TF_STATUS" == "cancelled" ]; then
            echo "::error::Upstream Terraform pipeline finished with status '$LATEST_TF_STATUS'. Halting database migration immediately to protect environment."
            exit 1
          fi

          echo "Terraform dependency check passed. Proceeding with database migration."

      - name: Determine Target Environment from Git Context
        id: env_resolver
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENV_INPUT: ${{ inputs.target_env }}
          GIT_REF: ${{ github.ref }}
          TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TARGET=""
          if [ -f ".environment/target_env" ]; then
            TARGET=$(tr -d ' \r\n' < .environment/target_env)
            echo "Loaded target environment from artifact: '$TARGET'"
          elif [ -f ".environment/deployment-environment/target_env" ]; then
            TARGET=$(tr -d ' \r\n' < .environment/deployment-environment/target_env)
            echo "Loaded target environment from artifact: '$TARGET'"
          fi

          if [ -z "$TARGET" ]; then
            if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
              TARGET="$TARGET_ENV_INPUT"
            elif [ "$EVENT_NAME" == "workflow_call" ]; then
              TARGET="$TARGET_ENV_INPUT"
            elif [ "$EVENT_NAME" == "workflow_run" ]; then
              if [ "$TRIGGERING_BRANCH" == "main" ]; then
                TARGET="prod"
              else
                TARGET="dev"
              fi
            elif [ "$EVENT_NAME" == "push" ] && [ "$GIT_REF" == "refs/heads/main" ]; then
              TARGET="prod"
            elif [ "$EVENT_NAME" == "push" ] && [ "$GIT_REF" == "refs/heads/dev" ]; then
              TARGET="dev"
            else
              TARGET="dev"
            fi
          fi

          echo "environment=$TARGET" >> $GITHUB_OUTPUT
          if [ "$TARGET" == "prod" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi
          echo "Target Environment: $TARGET"

  # ============================================================================
  # STAGE 1: LIQUIBASE DATABASE MIGRATION
  # ============================================================================
  database-migration:
    name: Liquibase Migration (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment]
    runs-on: [self-hosted, azure-vnet, "${{ needs.resolve-environment.outputs.environment }}"]
    timeout-minutes: 10
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate to Microsoft Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Pre-flight check: Verify MySQL Flexible Server and ewastescalabledb exist before installing Liquibase
      - name: Verify MySQL Server and Database Existence
        run: |
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          SERVER_NAME="mysql-ewastescalable-${TARGET_ENV}"
          RG="rg-ewastescalable-${TARGET_ENV}"
          DB_NAME="ewastescalabledb"

          SUB_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)
          az account set --subscription "$SUB_ID"

          echo "Checking existence of database '$DB_NAME' on server '$SERVER_NAME' in '$RG'..."
          az mysql flexible-server db show \
            --resource-group "$RG" \
            --server-name "$SERVER_NAME" \
            --database-name "$DB_NAME" \
            --query "{Database:name, Status:status}" -o table

          echo "Database '$DB_NAME' is online on '$SERVER_NAME'."
      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Liquibase CLI
        id: setup_liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          version: '4.32.0'
          edition: 'community'

      - name: Download MySQL JDBC Driver
        run: |
          mkdir -p /tmp/jdbc
          wget -qO /tmp/jdbc/mysql-connector-j-8.3.0.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.3.0/mysql-connector-j-8.3.0.jar
          # Copy to Liquibase lib directory so it is picked up automatically
          cp /tmp/jdbc/mysql-connector-j-8.3.0.jar "${{ steps.setup_liquibase.outputs.liquibase-path }}/lib/"

      - name: Verify Liquibase Installation
        run: liquibase --version

      - name: Execute Liquibase Database Migration
        env:
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
          MYSQL_HOST: "mysql-ewastescalable-${{ needs.resolve-environment.outputs.environment }}.mysql.database.azure.com"
          MYSQL_DB: "ewastescalabledb"
          MYSQL_USER: "ewasteadmin"
          MYSQL_PASS: ${{ secrets.MYSQL_DB_ADMIN_PASSWORD }}
          COMMAND: ${{ inputs.command || 'update' }}
        run: |
          echo "=========================================================="
          echo " Executing Liquibase: $COMMAND on $MYSQL_HOST / $MYSQL_DB"
          echo "=========================================================="

          # Seed data is applied across all environments including prod
          CONTEXT_PARAM="--contexts=seed"

          liquibase \
            --changelog-file=database/changelog-master.yaml \
            --url="jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DB}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true" \
            --username="${MYSQL_USER}" \
            --password="${MYSQL_PASS}" \
            $CONTEXT_PARAM \
            $COMMAND

          echo "Liquibase $COMMAND executed successfully."

      # ------------------------------------------------------------------------
      # EXPORT TARGET ENVIRONMENT ARTIFACT FOR DOWNSTREAM WORKFLOWS
      # ------------------------------------------------------------------------
      - name: Save Deployment Target Environment
        run: |
          mkdir -p .environment
          echo "${{ needs.resolve-environment.outputs.environment }}" > .environment/target_env

      - name: Upload Target Environment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-environment
          path: .environment/target_env
          retention-days: 1
