name: CD - Multi-Environment Deployment & Evidence Pipeline

on:
  workflow_run:
    workflows: ["Database - Liquibase Migration"]
    types:
      - completed
    branches: [dev, main]
  push:
    branches: [dev, main]
    # Must cover every global and service path in .github/service-catalog.json;
    # test_plan_services.py fails if a planner input is missing here.
    paths:
      - 'src/**'
      - 'contracts/matching/**'
      - 'scripts/ci/**'
      - 'scripts/deploy-matcher.sh'
      - '.github/service-catalog.json'
      - '.github/workflows/cd-pipeline.yml'
      - '.github/workflows/service-pipeline.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Azure Runtime Environment (dev, stg, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod
      services:
        description: 'Services to ship: "all", or comma-separated names from .github/service-catalog.json (e.g. "ui" or "claim-logistics,ui")'
        required: false
        default: 'all'
      rollback_tag:
        description: 'Optional: Image tag to rollback to (e.g. "PREVIOUS" for automatic N-1 release, or exact tag dev-a1b2c3d). Applies to each selected service. Leave empty for standard build.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: cd-deployment-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STAGE 0: DYNAMIC ENVIRONMENT RESOLUTION (2-Branch Strategy Mapping)
  # ============================================================================
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') }}
    outputs:
      environment: ${{ steps.env_resolver.outputs.environment }}
      is_production: ${{ steps.env_resolver.outputs.is_production }}
      deployment_desc: ${{ steps.env_resolver.outputs.deployment_desc }}
      resource_group: ${{ steps.env_resolver.outputs.resource_group }}
    steps:
      - name: Download Target Environment from Database Workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deployment-environment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .environment
        continue-on-error: true

      # ------------------------------------------------------------------------
      # QUEUE GUARD: Wait for in-progress Terraform or Database pipelines
      # ------------------------------------------------------------------------
      - name: Wait for Active Upstream Pipelines (Terraform & Database)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "=========================================================="
          echo " Checking for running upstream pipelines on $REF_NAME..."
          echo "=========================================================="

          MAX_WAIT=900
          WAITED=0
          INTERVAL=15

          while [ $WAITED -lt $MAX_WAIT ]; do
            ACTIVE_TF=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "IaC - Create Cloud Resources (Dev, Stg, Prod)" \
              --branch "$REF_NAME" \
              --json databaseId,status \
              --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' 2>/dev/null || echo "")

            ACTIVE_DB=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Database - Liquibase Migration" \
              --branch "$REF_NAME" \
              --json databaseId,status \
              --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' 2>/dev/null || echo "")

            if [ -z "$ACTIVE_TF" ] && [ -z "$ACTIVE_DB" ]; then
              echo "No active Terraform or Database pipelines running."
              break
            fi

            echo "Active upstream pipeline(s) detected:"
            [ -n "$ACTIVE_TF" ] && echo " - Terraform Run(s): $ACTIVE_TF"
            [ -n "$ACTIVE_DB" ] && echo " - Database Run(s): $ACTIVE_DB"
            echo "Queuing up and waiting $INTERVAL seconds (elapsed: ${WAITED}s)..."
            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "::error::Timed out after $MAX_WAIT seconds waiting for upstream pipelines to complete."
            exit 1
          fi

          LATEST_TF_STATUS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "IaC - Create Cloud Resources (Dev, Stg, Prod)" \
            --branch "$REF_NAME" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"' 2>/dev/null || echo "none")

          LATEST_DB_STATUS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Database - Liquibase Migration" \
            --branch "$REF_NAME" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"' 2>/dev/null || echo "none")

          if [ "$LATEST_TF_STATUS" == "failure" ] || [ "$LATEST_TF_STATUS" == "cancelled" ]; then
            echo "::error::Upstream Terraform pipeline finished with status '$LATEST_TF_STATUS'. Halting CD deployment immediately to protect environment."
            exit 1
          fi

          if [ "$LATEST_DB_STATUS" == "failure" ] || [ "$LATEST_DB_STATUS" == "cancelled" ]; then
            echo "::error::Upstream Database migration finished with status '$LATEST_DB_STATUS'. Halting CD deployment immediately to prevent deploying against unready schema."
            exit 1
          fi

          echo "All upstream dependency checks passed successfully!"

      - name: Determine Target Environment from Git Context
        id: env_resolver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TARGET_ENV_INPUT: ${{ inputs.target_env }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF: ${{ github.ref }}
          TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TARGET=""
          DESC=""
          if [ -f ".environment/target_env" ]; then
            TARGET=$(tr -d ' \r\n' < .environment/target_env)
            DESC="Automated pipeline cascade from Database Migration (Azure $(echo "$TARGET" | tr '[:lower:]' '[:upper:]'))"
            echo "Loaded target environment from artifact: '$TARGET'"
          elif [ -f ".environment/deployment-environment/target_env" ]; then
            TARGET=$(tr -d ' \r\n' < .environment/deployment-environment/target_env)
            DESC="Automated pipeline cascade from Database Migration (Azure $(echo "$TARGET" | tr '[:lower:]' '[:upper:]'))"
            echo "Loaded target environment from artifact: '$TARGET'"
          fi

          if [ -z "$TARGET" ]; then
            if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
              TARGET="$TARGET_ENV_INPUT"
              DESC="Manual workflow dispatch to Azure $(echo "$TARGET" | tr '[:lower:]' '[:upper:]')"
            elif [ "$GITHUB_EVENT_NAME" == "workflow_run" ]; then
              if [ "$TRIGGERING_BRANCH" == "main" ]; then
                TARGET="prod"
                DESC="Automated production cascade from Database Migration (Azure PROD)"
              else
                TARGET="dev"
                DESC="Automated development cascade from Database Migration (Azure DEV)"
              fi
            elif [ "$GITHUB_EVENT_NAME" == "pull_request" ] && [ "$GITHUB_BASE_REF" == "main" ]; then
              TARGET="stg"
              DESC="48-Hour Feature Freeze PR Staging Deployment (Azure STG for Evaluation)"
            elif [ "$GITHUB_EVENT_NAME" == "push" ] && [ "$GITHUB_REF" == "refs/heads/main" ]; then
              TARGET="prod"
              DESC="Merged Production Release (Azure PROD - Signed & Locked Baseline)"
            elif [ "$GITHUB_EVENT_NAME" == "push" ] && [ "$GITHUB_REF" == "refs/heads/dev" ]; then
              TARGET="dev"
              DESC="Active Development Continuous Integration Sandbox (Azure DEV)"
            else
              TARGET="dev"
              DESC="Default Development Deployment (Azure DEV)"
            fi
          fi

          echo "environment=$TARGET" >> $GITHUB_OUTPUT
          echo "deployment_desc=$DESC" >> $GITHUB_OUTPUT

          if [ "$TARGET" == "prod" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

          # Deterministic Infrastructure Topology Bindings
          echo "resource_group=rg-ewaste-${TARGET}" >> $GITHUB_OUTPUT

          echo "========================================================"
          echo " Target Environment: $TARGET"
          echo " Trigger Reason: $DESC"
          echo " Resource Group: rg-ewaste-${TARGET}"
          echo "========================================================"

  # ============================================================================
  # STAGE 1: PER-SERVICE PLAN (EWSS-19)
  # Decides which services ship: the ones whose code changed, the ones named
  # on a manual run, or all of them after a pipeline or database change. A
  # service ships only if its container app exists in the target environment.
  # ============================================================================
  plan-services:
    name: Plan Services (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      commit: ${{ steps.commit.outputs.sha }}
      image_tag: ${{ steps.commit.outputs.image_tag }}
      ui_build_args: ${{ steps.endpoints.outputs.ui_build_args }}
      aca_api_fqdn: ${{ steps.endpoints.outputs.aca_api_fqdn }}
      aca_ui_fqdn: ${{ steps.endpoints.outputs.aca_ui_fqdn }}
      aca_analytics_fqdn: ${{ steps.endpoints.outputs.aca_analytics_fqdn }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A database cascade must ship the commit that was migrated, not
          # whatever the default branch holds now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve Commit and Image Tag
        id: commit
        env:
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TARGET_ENV}-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Test the Service Planner
        run: python3 -m unittest discover -s scripts/ci

      - name: Authenticate to Microsoft Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List Container Apps in the Target Environment
        env:
          RG: ${{ needs.resolve-environment.outputs.resource_group }}
        run: |
          set -euo pipefail
          az containerapp list --resource-group "$RG" --query '[].name' --output tsv > existing-apps.txt
          echo "Container apps in $RG:"
          cat existing-apps.txt

      - name: Plan Services to Ship
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
          REQUESTED: ${{ inputs.services }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          select=()
          case "$EVENT_NAME" in
            workflow_dispatch)
              select=(--services "${REQUESTED:-all}") ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                git diff --name-only "$PUSH_BEFORE" HEAD > changed-files.txt
                select=(--changed-files changed-files.txt)
              else
                select=(--services all)
              fi ;;
            pull_request)
              git diff --name-only "${PR_BASE}...HEAD" > changed-files.txt
              select=(--changed-files changed-files.txt) ;;
            *)
              # Database cascade: the schema changed under every service.
              select=(--services all) ;;
          esac
          [ -f changed-files.txt ] && { echo "Changed files:"; cat changed-files.txt; }

          python3 scripts/ci/plan_services.py --environment "$TARGET_ENV" \
            --existing-apps existing-apps.txt "${select[@]}" > plan.json

          {
            echo "## Service Plan ($TARGET_ENV)"
            echo "| Service | Ships | Reason |"
            echo "| :--- | :---: | :--- |"
            jq -r '.include[] | "| `\(.name)` → `\(.app_name)` | yes | \(.reason) |"' plan.json
            jq -r '.skipped[] | "| `\(.name)` | no | \(.reason) |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "matrix=$(jq -c '{include: [.include[] | {service: .}]}' plan.json)"
            echo "count=$(jq '.include | length' plan.json)"
            echo "split_backend=$(jq -r '.groups["go-services"]' plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Service Endpoints
        id: endpoints
        env:
          RG: ${{ needs.resolve-environment.outputs.resource_group }}
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
          SPLIT_BACKEND: ${{ steps.plan.outputs.split_backend }}
        run: |
          set -euo pipefail
          fqdn() {
            grep -qx "aca-ewaste-${TARGET_ENV}-$1" existing-apps.txt || return 0
            az containerapp show --name "aca-ewaste-${TARGET_ENV}-$1" --resource-group "$RG" \
              --query properties.configuration.ingress.fqdn --output tsv
          }
          API=$(fqdn api); UI=$(fqdn ui); ANALYTICS=$(fqdn analytics)

          ARGS="NEXT_PUBLIC_USE_MOCK_AUTH=false"
          if [ -n "$API" ]; then
            ARGS+=$'\n'"NEXT_PUBLIC_API_URL=https://$API"$'\n'"NEXT_PUBLIC_API_BASE_URL=https://$API"$'\n'"API_PROXY_TARGET=https://$API"
          fi
          # Split API routing only once all four Go services are live.
          if [ "$SPLIT_BACKEND" = "true" ]; then
            ARGS+=$'\n'"IDENTITY_ACCESS_URL=https://$(fqdn auth)"
            ARGS+=$'\n'"BATCH_WORKFLOW_URL=https://$API"
            ARGS+=$'\n'"CLAIM_LOGISTICS_URL=https://$(fqdn claim)"
            ARGS+=$'\n'"CUSTODY_VERIFICATION_URL=https://$(fqdn custody)"
          fi
          {
            echo "aca_api_fqdn=$API"
            echo "aca_ui_fqdn=$UI"
            echo "aca_analytics_fqdn=$ANALYTICS"
            echo "ui_build_args<<EOF_UI_ARGS"
            echo "$ARGS"
            echo "EOF_UI_ARGS"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # STAGE 2: BUILD, TEST, SCAN & DEPLOY EACH PLANNED SERVICE ON ITS OWN
  # One failing service does not stop the others (fail-fast: false).
  # ============================================================================
  services:
    name: Ship
    needs: [resolve-environment, plan-services]
    if: needs.plan-services.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-services.outputs.matrix) }}
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: ${{ toJSON(matrix.service) }}
      environment: ${{ needs.resolve-environment.outputs.environment }}
      resource_group: ${{ needs.resolve-environment.outputs.resource_group }}
      commit: ${{ needs.plan-services.outputs.commit }}
      image_tag: ${{ needs.plan-services.outputs.image_tag }}
      rollback_tag: ${{ inputs.rollback_tag }}
      ui_build_args: ${{ needs.plan-services.outputs.ui_build_args }}
    secrets:
      AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      MATCHER_SIGNING_SECRET: ${{ secrets.MATCHER_SIGNING_SECRET }}
      EWASTE_AUTH_ANALYTICS_SERVICE_TOKEN: ${{ secrets.EWASTE_AUTH_ANALYTICS_SERVICE_TOKEN }}
      ANALYTICS_SERVICE_TOKEN: ${{ secrets.ANALYTICS_SERVICE_TOKEN }}

  # ============================================================================
  # STAGE 3: DYNAMIC APPLICATION SECURITY TESTING (OWASP ZAP)
  # Runs after any service ships; scans the environment's API entry point.
  # ============================================================================
  dast-security-scan:
    name: OWASP ZAP DAST Scan (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, plan-services, services]
    if: needs.services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Execute OWASP ZAP Baseline Scan Against Deployed Service
        if: needs.plan-services.outputs.aca_api_fqdn != ''
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "https://${{ needs.plan-services.outputs.aca_api_fqdn }}"
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Retain OWASP ZAP DAST Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-dast-${{ needs.resolve-environment.outputs.environment }}-${{ needs.plan-services.outputs.commit }}
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

  # ============================================================================
  # STAGE 4: POST-DEPLOYMENT SMOKE & AUDIT VERIFICATION
  # ============================================================================
  smoke-and-audit-verification:
    name: Smoke & Audit Verification (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, plan-services, services, dast-security-scan]
    if: needs.services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ------------------------------------------------------------------------
      # 3.1 BACKEND API AUTHENTICATION SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Execute Seeded-User Login API Smoke Test
        run: |
          API_FQDN="${{ needs.plan-services.outputs.aca_api_fqdn }}"
          if [ -n "$API_FQDN" ]; then
            API_URL="https://${API_FQDN}/api/v1/auth/login"
            CORRELATION_ID="smoke-api-${{ needs.resolve-environment.outputs.environment }}-$(date +%s)"
            echo "Executing API authentication test with correlation ID: $CORRELATION_ID"

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "X-Correlation-ID: $CORRELATION_ID" \
              -d '{"email":"admin@ewaste.local","password":"Password123!"}' || true)

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "API HTTP Response Status: $HTTP_STATUS"
            echo "API HTTP Response Body: $HTTP_BODY"
          else
            echo "API smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.2 FRONTEND UI ACCESSIBILITY SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Execute Frontend UI Endpoint Smoke Test
        run: |
          UI_FQDN="${{ needs.plan-services.outputs.aca_ui_fqdn }}"
          if [ -n "$UI_FQDN" ]; then
            UI_URL="https://${UI_FQDN}/"
            echo "Verifying Frontend UI accessibility at: $UI_URL"
            UI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$UI_URL" || true)
            echo "UI HTTP Response Status: $UI_STATUS"
          else
            echo "UI smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.3 ANALYTICS WORKER & EVENT HUBS INTEGRATION SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Verify Matcher Without Synthetic Business Events
        run: |
          ANALYTICS_FQDN="${{ needs.plan-services.outputs.aca_analytics_fqdn }}"
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"

          if [ -n "$ANALYTICS_FQDN" ] && [ "$TARGET_ENV" == "dev" ]; then
            echo "Verifying Analytics ingress accessibility at: https://$ANALYTICS_FQDN/readyz"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" "https://$ANALYTICS_FQDN/readyz" || true)
              echo "Analytics Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" == "200" ]; then
                echo "Analytics Worker verified successfully (HTTP 200)."
                break
              fi
              sleep 10
            done
            if [ "$STATUS_CODE" != "200" ]; then
              echo "::error::Analytics Worker did not become ready after 12 attempts."
              exit 1
            fi
          elif [ -n "$ANALYTICS_FQDN" ]; then
            echo "Matcher ingress is internal in $TARGET_ENV; the authenticated deployment step verified the new ACA revision's health."
            echo "Broker readiness is available at /readyz from inside the ACA environment."
          else
            echo "::error::Analytics smoke test cannot run: FQDN not yet assigned."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # 3.4 DEPLOYMENT SUMMARY & ARCHIVAL BANNER
      # ------------------------------------------------------------------------
      - name: Confirm Deployment & Archival State
        run: |
          echo "======================================================================"
          echo "  DEPLOYMENT & AUDIT SUITE COMPLETED SUCCESSFULLY"
          echo "  - Environment Target: ${{ needs.resolve-environment.outputs.environment }}"
          echo "  - Deployment Scope: ${{ needs.resolve-environment.outputs.deployment_desc }}"
          echo "  - Database Status: Migrations are a prerequisite; authenticated matcher lookup verified"
          echo "  - Container Release: Per-service (see the Service Plan and each Ship job summary)"
          echo "  - Event Streaming: Kafka/MySQL persistence tested in matcher CI; live checks respect environment ingress"
          echo "  - Runtime Health: ACA Ingress Probes Verified (:8080, :3000, :8000)"
          echo "  - DAST Scan: OWASP ZAP Report Retained for Academic Review"
          echo "======================================================================"
