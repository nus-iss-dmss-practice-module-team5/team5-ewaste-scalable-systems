name: CD - Multi-Environment Deployment & Evidence Pipeline

on:
  workflow_run:
    workflows: ["Database - Liquibase Migration"]
    types:
      - completed
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - '.github/workflows/cd-pipeline.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Azure Runtime Environment (dev, stg, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod
      rollback_tag:
        description: 'Optional: Image tag to rollback to (e.g. "PREVIOUS" for automatic N-1 release, or exact tag dev-a1b2c3d). Leave empty for standard build.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: cd-deployment-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME_API: 'workflow-api'
  IMAGE_NAME_UI: 'workflow-ui'
  IMAGE_NAME_ANALYTICS: 'workflow-analytics'

jobs:
  # ============================================================================
  # STAGE 0: DYNAMIC ENVIRONMENT RESOLUTION (2-Branch Strategy Mapping)
  # ============================================================================
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') }}
    outputs:
      environment: ${{ steps.env_resolver.outputs.environment }}
      is_production: ${{ steps.env_resolver.outputs.is_production }}
      deployment_desc: ${{ steps.env_resolver.outputs.deployment_desc }}
      resource_group: ${{ steps.env_resolver.outputs.resource_group }}
    steps:
      - name: Download Target Environment from Database Workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deployment-environment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .environment
        continue-on-error: true

      # ------------------------------------------------------------------------
      # QUEUE GUARD: Wait for in-progress Terraform or Database pipelines
      # ------------------------------------------------------------------------
      - name: Wait for Active Upstream Pipelines (Terraform & Database)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "=========================================================="
          echo " Checking for running upstream pipelines on $REF_NAME..."
          echo "=========================================================="

          MAX_WAIT=900
          WAITED=0
          INTERVAL=15

          while [ $WAITED -lt $MAX_WAIT ]; do
            ACTIVE_TF=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "IaC - Create Cloud Resources (Dev, Stg, Prod)" \
              --branch "$REF_NAME" \
              --json databaseId,status \
              --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' 2>/dev/null || echo "")

            ACTIVE_DB=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Database - Liquibase Migration" \
              --branch "$REF_NAME" \
              --json databaseId,status \
              --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' 2>/dev/null || echo "")

            if [ -z "$ACTIVE_TF" ] && [ -z "$ACTIVE_DB" ]; then
              echo "No active Terraform or Database pipelines running."
              break
            fi

            echo "Active upstream pipeline(s) detected:"
            [ -n "$ACTIVE_TF" ] && echo " - Terraform Run(s): $ACTIVE_TF"
            [ -n "$ACTIVE_DB" ] && echo " - Database Run(s): $ACTIVE_DB"
            echo "Queuing up and waiting $INTERVAL seconds (elapsed: ${WAITED}s)..."
            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "::error::Timed out after $MAX_WAIT seconds waiting for upstream pipelines to complete."
            exit 1
          fi

          LATEST_TF_STATUS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "IaC - Create Cloud Resources (Dev, Stg, Prod)" \
            --branch "$REF_NAME" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"' 2>/dev/null || echo "none")

          LATEST_DB_STATUS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Database - Liquibase Migration" \
            --branch "$REF_NAME" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"' 2>/dev/null || echo "none")

          if [ "$LATEST_TF_STATUS" == "failure" ] || [ "$LATEST_TF_STATUS" == "cancelled" ]; then
            echo "::error::Upstream Terraform pipeline finished with status '$LATEST_TF_STATUS'. Halting CD deployment immediately to protect environment."
            exit 1
          fi

          if [ "$LATEST_DB_STATUS" == "failure" ] || [ "$LATEST_DB_STATUS" == "cancelled" ]; then
            echo "::error::Upstream Database migration finished with status '$LATEST_DB_STATUS'. Halting CD deployment immediately to prevent deploying against unready schema."
            exit 1
          fi

          echo "All upstream dependency checks passed successfully!"

      - name: Determine Target Environment from Git Context
        id: env_resolver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TARGET_ENV_INPUT: ${{ inputs.target_env }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF: ${{ github.ref }}
          TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TARGET=""
          DESC=""
          if [ -f ".environment/target_env" ]; then
            TARGET=$(tr -d ' \r\n' < .environment/target_env)
            DESC="Automated pipeline cascade from Database Migration (Azure $(echo "$TARGET" | tr '[:lower:]' '[:upper:]'))"
            echo "Loaded target environment from artifact: '$TARGET'"
          elif [ -f ".environment/deployment-environment/target_env" ]; then
            TARGET=$(tr -d ' \r\n' < .environment/deployment-environment/target_env)
            DESC="Automated pipeline cascade from Database Migration (Azure $(echo "$TARGET" | tr '[:lower:]' '[:upper:]'))"
            echo "Loaded target environment from artifact: '$TARGET'"
          fi

          if [ -z "$TARGET" ]; then
            if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
              TARGET="$TARGET_ENV_INPUT"
              DESC="Manual workflow dispatch to Azure $(echo "$TARGET" | tr '[:lower:]' '[:upper:]')"
            elif [ "$GITHUB_EVENT_NAME" == "workflow_run" ]; then
              if [ "$TRIGGERING_BRANCH" == "main" ]; then
                TARGET="prod"
                DESC="Automated production cascade from Database Migration (Azure PROD)"
              else
                TARGET="dev"
                DESC="Automated development cascade from Database Migration (Azure DEV)"
              fi
            elif [ "$GITHUB_EVENT_NAME" == "pull_request" ] && [ "$GITHUB_BASE_REF" == "main" ]; then
              TARGET="stg"
              DESC="48-Hour Feature Freeze PR Staging Deployment (Azure STG for Evaluation)"
            elif [ "$GITHUB_EVENT_NAME" == "push" ] && [ "$GITHUB_REF" == "refs/heads/main" ]; then
              TARGET="prod"
              DESC="Merged Production Release (Azure PROD - Signed & Locked Baseline)"
            elif [ "$GITHUB_EVENT_NAME" == "push" ] && [ "$GITHUB_REF" == "refs/heads/dev" ]; then
              TARGET="dev"
              DESC="Active Development Continuous Integration Sandbox (Azure DEV)"
            else
              TARGET="dev"
              DESC="Default Development Deployment (Azure DEV)"
            fi
          fi

          echo "environment=$TARGET" >> $GITHUB_OUTPUT
          echo "deployment_desc=$DESC" >> $GITHUB_OUTPUT

          if [ "$TARGET" == "prod" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

          # Deterministic Infrastructure Topology Bindings
          echo "resource_group=rg-ewastescalable-${TARGET}" >> $GITHUB_OUTPUT

          echo "========================================================"
          echo " Target Environment: $TARGET"
          echo " Trigger Reason: $DESC"
          echo " Resource Group: rg-ewastescalable-${TARGET}"
          echo "========================================================"

  # ============================================================================
  # STAGE 1: MULTI-CONTAINER RELEASE (API, UI & ANALYTICS) & ACA DEPLOYMENT
  # Runs on VNet-injected self-hosted runner with direct Private Link to ACR
  # ============================================================================
  deploy-application:
    name: Package & Deploy (API, UI & Analytics - ${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment]
    runs-on: [self-hosted, azure-vnet, "${{ needs.resolve-environment.outputs.environment }}"]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      aca_api_fqdn: ${{ steps.api_deploy.outputs.aca_api_fqdn }}
      aca_ui_fqdn: ${{ steps.ui_deploy.outputs.aca_ui_fqdn }}
      aca_analytics_fqdn: ${{ steps.analytics_deploy.outputs.aca_analytics_fqdn }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Microsoft Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Matcher Workload Configuration
        env:
          MATCHER_SIGNING_SECRET: ${{ secrets.MATCHER_SIGNING_SECRET }}
          ANALYTICS_SERVICE_TOKEN: ${{ secrets.EWASTE_AUTH_ANALYTICS_SERVICE_TOKEN || secrets.ANALYTICS_SERVICE_TOKEN }}
        run: |
          test "${#MATCHER_SIGNING_SECRET}" -ge 32
          if [ "${#ANALYTICS_SERVICE_TOKEN}" -lt 32 ]; then
            echo "::error::Set EWASTE_AUTH_ANALYTICS_SERVICE_TOKEN (or legacy ANALYTICS_SERVICE_TOKEN) with at least 32 characters."
            exit 1
          fi

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Log in to Azure Container Registry
        run: |
          ACR_NAME=$(echo "${{ secrets.AZURE_ACR_NAME }}" | cut -d'.' -f1)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV

          echo "Logging into Azure CLI via local VM Managed Identity..."
          az login --identity

          echo "Fetching secure passwordless token for registry login server..."
          ACR_TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --query accessToken --output tsv)

          echo "Seeding docker daemon authentication context..."
          echo "$ACR_TOKEN" | docker login "$ACR_NAME".azurecr.io -u 00000000-0000-0000-0000-000000000000 --password-stdin

      # ------------------------------------------------------------------------
      # Resolve Target Deployment Image Tags (STANDARD, EXPLICIT, OR SMART PREVIOUS)
      # ------------------------------------------------------------------------
      - name: Resolve Effective Deployment Image Tags
        id: resolve_tags
        env:
          GITHUB_SHA: ${{ github.sha }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
          RAW_INPUT: ${{ inputs.rollback_tag }}
          IMAGE_NAME_API: ${{ env.IMAGE_NAME_API }}
        run: |
          ACR_SERVER="${AZURE_ACR_NAME}.azurecr.io"
          ACR_NAME=$(echo "$ACR_SERVER" | cut -d'.' -f1)

          # Normalize input: trim whitespace and uppercase
          NORMALIZED_INPUT=$(echo "$RAW_INPUT" | tr '[:lower:]' '[:upper:]' | xargs)

          IS_ROLLBACK="false"
          RESOLVED_TAG=""

          if [ "$NORMALIZED_INPUT" == "PREVIOUS" ] || [ "$NORMALIZED_INPUT" == "N-1" ]; then
            IS_ROLLBACK="true"
            echo "Smart Rollback requested: Querying ACR for previous (N-1) verified image tag..."

            # Query ACR tags for API service ordered newest first, matching target environment prefix
            RESOLVED_TAG=$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$IMAGE_NAME_API" \
              --orderby time_desc \
              --output tsv 2>/dev/null | grep "^${TARGET_ENV}-" | sed -n '2p' || echo "")

            if [ -z "$RESOLVED_TAG" ]; then
              # Fallback if prefix filtering didn't match
              RESOLVED_TAG=$(az acr repository show-tags \
                --name "$ACR_NAME" \
                --repository "$IMAGE_NAME_API" \
                --orderby time_desc \
                --output tsv 2>/dev/null | sed -n '2p' || echo "")
            fi

            if [ -z "$RESOLVED_TAG" ]; then
              echo "::error::Smart Rollback failed: Could not determine an N-1 previous tag in ACR for environment '$TARGET_ENV'."
              exit 1
            fi
            echo "Successfully resolved N-1 rollback tag: $RESOLVED_TAG"

          elif [ -n "$RAW_INPUT" ]; then
            IS_ROLLBACK="true"
            RESOLVED_TAG="$RAW_INPUT"
            echo "Explicit Rollback requested with tag: $RESOLVED_TAG"
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            RESOLVED_TAG="${TARGET_ENV}-${SHORT_SHA}"
            echo "Standard Build requested with commit tag: $RESOLVED_TAG"
          fi

          echo "is_rollback=$IS_ROLLBACK" >> "$GITHUB_OUTPUT"
          echo "effective_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # 1.1 BACKEND API CONTAINER
      # ------------------------------------------------------------------------
      - name: Build & Publish Backend API Container
        env:
          TARGET_TAG: ${{ steps.resolve_tags.outputs.effective_tag }}
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"

          if [ "${{ steps.resolve_tags.outputs.is_rollback }}" == "true" ]; then
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_API }}:${TARGET_TAG}"
            echo "Rolling back to existing API image: $IMAGE_TAG"
            docker pull "$IMAGE_TAG" || true
          else
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_API }}:${TARGET_TAG}"
            echo "Building API image: $IMAGE_TAG"
            docker build -t "$IMAGE_TAG" -f src/backend/Dockerfile src/backend/
            echo "Pushing API image to ACR..."
            docker push "$IMAGE_TAG"
          fi
          echo "API_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

          API_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG" 2>/dev/null || echo "$IMAGE_TAG")
          echo "API_IMMUTABLE_DIGEST=$API_DIGEST" >> $GITHUB_ENV

#      - name: Sign API Container Image Digest with Cosign
#        run: |
#          echo "Signing immutable API image digest: ${{ env.API_IMMUTABLE_DIGEST }}"
#          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
#            cosign sign --yes \
#              --key env://COSIGN_PRIVATE_KEY \
#              ${{ env.API_IMMUTABLE_DIGEST }}
#          else
#            echo "Generating ephemeral keypair for API signing..."
#            if [ ! -f cosign.key ]; then
#              cosign generate-key-pair
#            fi
#            cosign sign --yes --key cosign.key ${{ env.API_IMMUTABLE_DIGEST }}
#          fi
#        env:
#          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
#          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      # ------------------------------------------------------------------------
      # AUTHENTICATION CONTEXT FOR CONTAINER APPS MANAGEMENT
      # ------------------------------------------------------------------------
      - name: Switch Azure CLI Context to Service Principal
        run: |
          SP_APP_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)
          SP_PASS=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)
          SP_TENANT=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)
          SP_SUB=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)

          echo "Authenticating Azure CLI with Deployment Service Principal..."
          az login --service-principal -u "$SP_APP_ID" -p "$SP_PASS" --tenant "$SP_TENANT" > /dev/null
          az account set --subscription "$SP_SUB"

      - name: Deploy API Container to Azure Container Apps
        id: api_deploy
        run: |
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          RG="${{ needs.resolve-environment.outputs.resource_group }}"
          APP_NAME="aca-ewastescalable-${TARGET_ENV}-api"

          echo "Performing atomic container image update for $APP_NAME in $RG..."
          echo "Target Image Digest: ${{ env.API_IMMUTABLE_DIGEST }}"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "${{ env.API_IMMUTABLE_DIGEST }}" \
            --output none

          API_FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "aca_api_fqdn=$API_FQDN" >> "$GITHUB_OUTPUT"
          echo "API deployed successfully: https://$API_FQDN"

      # ------------------------------------------------------------------------
      # 1.2 FRONTEND UI CONTAINER
      # ------------------------------------------------------------------------
      - name: Build & Publish Frontend UI Container
        env:
          TARGET_TAG: ${{ steps.resolve_tags.outputs.effective_tag }}
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          API_URL="https://${{ steps.api_deploy.outputs.aca_api_fqdn }}"

          if [ "${{ steps.resolve_tags.outputs.is_rollback }}" == "true" ]; then
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_UI }}:${TARGET_TAG}"
            echo "Rolling back to existing UI image: $IMAGE_TAG"
            docker pull "$IMAGE_TAG" || true
          else
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_UI }}:${TARGET_TAG}"
            echo "Building UI image: $IMAGE_TAG"
            docker build -t "$IMAGE_TAG" \
              --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
              --build-arg NEXT_PUBLIC_API_BASE_URL="$API_URL" \
              --build-arg API_PROXY_TARGET="$API_URL" \
              --build-arg NEXT_PUBLIC_USE_MOCK_AUTH="false" \
              -f src/frontend/Dockerfile src/frontend/
            echo "Pushing UI image to ACR..."
            docker push "$IMAGE_TAG"
          fi
          echo "UI_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

          UI_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG" 2>/dev/null || echo "$IMAGE_TAG")
          echo "UI_IMMUTABLE_DIGEST=$UI_DIGEST" >> $GITHUB_ENV

#      - name: Sign UI Container Image Digest with Cosign
#        run: |
#          echo "Signing immutable UI image digest: ${{ env.UI_IMMUTABLE_DIGEST }}"
#          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
#            cosign sign --yes \
#              --key env://COSIGN_PRIVATE_KEY \
#              ${{ env.UI_IMMUTABLE_DIGEST }}
#          else
#            echo "Signing UI image with cosign key..."
#            if [ ! -f cosign.key ]; then
#              cosign generate-key-pair
#            fi
#            cosign sign --yes --key cosign.key ${{ env.UI_IMMUTABLE_DIGEST }}
#          fi
#        env:
#          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
#          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Deploy UI Container to Azure Container Apps
        id: ui_deploy
        run: |
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          RG="${{ needs.resolve-environment.outputs.resource_group }}"
          APP_NAME="aca-ewastescalable-${TARGET_ENV}-ui"

          echo "Performing atomic container image update for $APP_NAME in $RG..."
          echo "Target Image Digest: ${{ env.UI_IMMUTABLE_DIGEST }}"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "${{ env.UI_IMMUTABLE_DIGEST }}" \
            --output none

          UI_FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "aca_ui_fqdn=$UI_FQDN" >> "$GITHUB_OUTPUT"
          echo "UI deployed successfully: https://$UI_FQDN"

      # ------------------------------------------------------------------------
      # 1.3 ANALYTICS WORKER CONTAINER
      # ------------------------------------------------------------------------
      - name: Build and Push Analytics Worker Image to ACR
        env:
          TARGET_TAG: ${{ steps.resolve_tags.outputs.effective_tag }}
        run: |
          set -euo pipefail
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"

          if [ "${{ steps.resolve_tags.outputs.is_rollback }}" == "true" ]; then
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_ANALYTICS }}:${TARGET_TAG}"
            echo "Rolling back to existing Matcher image: $IMAGE_TAG"
            docker pull "$IMAGE_TAG"
            # A rollback must name an actual matcher image, not the old demo.
            test "$(docker inspect --format '{{index .Config.Labels "ewaste.component"}}' "$IMAGE_TAG")" = matcher
          else
            IMAGE_TAG="${ACR_SERVER}/${{ env.IMAGE_NAME_ANALYTICS }}:${TARGET_TAG}"
            echo "Building Matcher Worker image: $IMAGE_TAG"
            docker build -t "$IMAGE_TAG" -f src/matcher/Dockerfile .
            echo "Pushing Matcher Worker image to ACR..."
            docker push "$IMAGE_TAG"
          fi

          ANALYTICS_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          [[ "$ANALYTICS_DIGEST" == *@sha256:* ]] || { echo 'Matcher image digest is missing or mutable.' >&2; exit 1; }
          echo "ANALYTICS_IMMUTABLE_DIGEST=$ANALYTICS_DIGEST" >> "$GITHUB_ENV"

      - name: Deploy Analytics Worker to Azure Container Apps
        id: analytics_deploy
        env:
          MATCHER_SIGNING_SECRET: ${{ secrets.MATCHER_SIGNING_SECRET }}
          ANALYTICS_SERVICE_TOKEN: ${{ secrets.EWASTE_AUTH_ANALYTICS_SERVICE_TOKEN || secrets.ANALYTICS_SERVICE_TOKEN }}
        run: |
          export TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"
          export RG="${{ needs.resolve-environment.outputs.resource_group }}"
          export MATCHER_IMAGE="${{ env.ANALYTICS_IMMUTABLE_DIGEST }}"
          APP_NAME="aca-ewastescalable-${TARGET_ENV}-analytic"

          echo "Configuring matcher integration and updating $APP_NAME in $RG..."
          echo "Target Image Digest: $MATCHER_IMAGE"

          # Configure the API and worker, deploy the digest, check readiness and
          # export aca_analytics_fqdn for the existing downstream steps.
          bash scripts/deploy-matcher.sh

      # ------------------------------------------------------------------------
      # 1.4 LIVE CONTAINER READINESS PROBES (API, UI & ANALYTICS)
      # ------------------------------------------------------------------------
      - name: Verify Live ACA Health Readiness Probes (API, UI & Analytics)
        run: |
          API_FQDN="${{ steps.api_deploy.outputs.aca_api_fqdn }}"
          UI_FQDN="${{ steps.ui_deploy.outputs.aca_ui_fqdn }}"
          ANALYTICS_FQDN="${{ steps.analytics_deploy.outputs.aca_analytics_fqdn }}"
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"

          if [ -n "$API_FQDN" ]; then
            echo "Verifying API ingress accessibility at: https://$API_FQDN"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_FQDN" || true)
              echo "API Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" != "000" ] && [ "$STATUS_CODE" -lt 500 ]; then
                echo "API verified successfully (HTTP $STATUS_CODE)."
                break
              fi
              sleep 10
            done
          fi

          if [ -n "$UI_FQDN" ]; then
            echo "Verifying UI ingress accessibility at: https://$UI_FQDN"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$UI_FQDN" || true)
              echo "UI Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" != "000" ] && [ "$STATUS_CODE" -lt 500 ]; then
                echo "UI verified successfully (HTTP $STATUS_CODE)."
                break
              fi
              sleep 10
            done
          fi

          # Analytics uses external ingress only in dev; stg/prod runs with internal ingress.
          # The ACA environment handles internal health probing — no external curl needed.
          if [ -n "$ANALYTICS_FQDN" ] && [ "$TARGET_ENV" == "dev" ]; then
            echo "Verifying Analytics ingress accessibility at: https://$ANALYTICS_FQDN/readyz"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$ANALYTICS_FQDN/readyz" || true)
              echo "Analytics Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" == "200" ]; then
                echo "Analytics Worker verified successfully (HTTP 200)."
                break
              fi
              sleep 10
            done
          elif [ -n "$ANALYTICS_FQDN" ]; then
            echo "Analytics Worker uses internal ingress in $TARGET_ENV — readiness probe skipped (ACA manages internal routing)."
          fi

      # ------------------------------------------------------------------------
      # 1.5 PRUNE OLD ACR IMAGES (Retain Last 3 for Rollback Safety)
      # ------------------------------------------------------------------------
      - name: Prune Stale Container Images in ACR (Keep Last 3)
        if: steps.resolve_tags.outputs.is_rollback != 'true'
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          ACR_NAME=$(echo "$ACR_SERVER" | cut -d'.' -f1)

          for REPO in "${{ env.IMAGE_NAME_API }}" "${{ env.IMAGE_NAME_UI }}" "${{ env.IMAGE_NAME_ANALYTICS }}"; do
            echo "Checking image tags for repository: $REPO"

            # Fetch tags sorted by creation time (newest first), skip top 3, and delete the rest
            TAGS_TO_DELETE=$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$REPO" \
              --orderby time_desc \
              --output tsv | tail -n +4)

            if [ -n "$TAGS_TO_DELETE" ]; then
              echo "Pruning older tags in $REPO:"
              echo "$TAGS_TO_DELETE"
              for TAG in $TAGS_TO_DELETE; do
                az acr repository delete --name "$ACR_NAME" --image "${REPO}:${TAG}" --yes
              done
            else
              echo "Repository $REPO has 3 or fewer tags. Nothing to prune."
            fi
          done

      # ------------------------------------------------------------------------
      # 1.6 PUBLISH ROLLBACK CANDIDATES TO GITHUB ACTIONS SUMMARY
      # ------------------------------------------------------------------------
      - name: Publish Rollback Tag Catalog to Job Summary
        if: always()
        env:
          TARGET_TAG: ${{ steps.resolve_tags.outputs.effective_tag }}
        run: |
          ACR_SERVER="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          ACR_NAME=$(echo "$ACR_SERVER" | cut -d'.' -f1)

          echo "## Deployment & Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Tag:** \`${TARGET_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Mode:** \`${{ steps.resolve_tags.outputs.is_rollback == 'true' && 'Rollback' || 'Standard Build' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** \`${{ needs.resolve-environment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> **One-Click Rollback:** To roll back to the prior stable release at any time, run this workflow and enter **\`PREVIOUS\`** for \`rollback_tag\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verified Available Image Tags in ACR" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Latest Available Tags (Newest First) | Target Environment |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY

          for REPO in "${{ env.IMAGE_NAME_API }}" "${{ env.IMAGE_NAME_UI }}" "${{ env.IMAGE_NAME_ANALYTICS }}"; do
            TAGS=$(az acr repository show-tags --name "$ACR_NAME" --repository "$REPO" --orderby time_desc --output tsv 2>/dev/null | head -n 5 | paste -sd ", " - || echo "None")
            echo "| \`$REPO\` | \`$TAGS\` | \`${{ needs.resolve-environment.outputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          done

  # ============================================================================
  # STAGE 2: DYNAMIC APPLICATION SECURITY TESTING (OWASP ZAP)
  # ============================================================================
  dast-security-scan:
    name: OWASP ZAP DAST Scan (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, deploy-application]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Execute OWASP ZAP Baseline Scan Against Deployed Service
        if: needs.deploy-application.outputs.aca_api_fqdn != ''
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "https://${{ needs.deploy-application.outputs.aca_api_fqdn }}"
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Retain OWASP ZAP DAST Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-dast-${{ needs.resolve-environment.outputs.environment }}-${{ github.sha }}
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

  # ============================================================================
  # STAGE 3: POST-DEPLOYMENT SMOKE & AUDIT VERIFICATION
  # ============================================================================
  smoke-and-audit-verification:
    name: Smoke & Audit Verification (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, deploy-application, dast-security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ------------------------------------------------------------------------
      # 3.1 BACKEND API AUTHENTICATION SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Execute Seeded-User Login API Smoke Test
        run: |
          API_FQDN="${{ needs.deploy-application.outputs.aca_api_fqdn }}"
          if [ -n "$API_FQDN" ]; then
            API_URL="https://${API_FQDN}/api/v1/auth/login"
            CORRELATION_ID="smoke-api-${{ needs.resolve-environment.outputs.environment }}-$(date +%s)"
            echo "Executing API authentication test with correlation ID: $CORRELATION_ID"

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "X-Correlation-ID: $CORRELATION_ID" \
              -d '{"email":"admin@ewaste.local","password":"Password123!"}' || true)

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "API HTTP Response Status: $HTTP_STATUS"
            echo "API HTTP Response Body: $HTTP_BODY"
          else
            echo "API smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.2 FRONTEND UI ACCESSIBILITY SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Execute Frontend UI Endpoint Smoke Test
        run: |
          UI_FQDN="${{ needs.deploy-application.outputs.aca_ui_fqdn }}"
          if [ -n "$UI_FQDN" ]; then
            UI_URL="https://${UI_FQDN}/"
            echo "Verifying Frontend UI accessibility at: $UI_URL"
            UI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$UI_URL" || true)
            echo "UI HTTP Response Status: $UI_STATUS"
          else
            echo "UI smoke test skipped: FQDN not yet assigned."
          fi

      # ------------------------------------------------------------------------
      # 3.3 ANALYTICS WORKER & EVENT HUBS INTEGRATION SMOKE TEST
      # ------------------------------------------------------------------------
      - name: Verify Matcher Without Synthetic Business Events
        run: |
          ANALYTICS_FQDN="${{ needs.deploy-application.outputs.aca_analytics_fqdn }}"
          TARGET_ENV="${{ needs.resolve-environment.outputs.environment }}"

          if [ -n "$ANALYTICS_FQDN" ] && [ "$TARGET_ENV" == "dev" ]; then
            echo "Verifying Analytics ingress accessibility at: https://$ANALYTICS_FQDN/readyz"
            for i in {1..12}; do
              STATUS_CODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" "https://$ANALYTICS_FQDN/readyz" || true)
              echo "Analytics Probe Attempt $i/12 (HTTP: $STATUS_CODE)"
              if [ "$STATUS_CODE" == "200" ]; then
                echo "Analytics Worker verified successfully (HTTP 200)."
                break
              fi
              sleep 10
            done
            if [ "$STATUS_CODE" != "200" ]; then
              echo "::error::Analytics Worker did not become ready after 12 attempts."
              exit 1
            fi
          elif [ -n "$ANALYTICS_FQDN" ]; then
            echo "Matcher ingress is internal in $TARGET_ENV; the authenticated deployment step verified the new ACA revision's health."
            echo "Broker readiness is available at /readyz from inside the ACA environment."
          else
            echo "::error::Analytics smoke test cannot run: FQDN not yet assigned."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # 3.4 DEPLOYMENT SUMMARY & ARCHIVAL BANNER
      # ------------------------------------------------------------------------
      - name: Confirm Deployment & Archival State
        run: |
          echo "======================================================================"
          echo "  DEPLOYMENT & AUDIT SUITE COMPLETED SUCCESSFULLY"
          echo "  - Environment Target: ${{ needs.resolve-environment.outputs.environment }}"
          echo "  - Deployment Scope: ${{ needs.resolve-environment.outputs.deployment_desc }}"
          echo "  - Database Status: Migrations are a prerequisite; authenticated matcher lookup verified"
          echo "  - Container Release: Multi-Container Verified (API, UI, & Analytics)"
          echo "  - Event Streaming: Kafka/MySQL persistence tested in matcher CI; live checks respect environment ingress"
          echo "  - Runtime Health: ACA Ingress Probes Verified (:8080, :3000, :8000)"
          echo "  - DAST Scan: OWASP ZAP Report Retained for Academic Review"
          echo "======================================================================"
