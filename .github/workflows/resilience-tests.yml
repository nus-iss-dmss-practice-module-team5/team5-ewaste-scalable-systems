name: Resilience - Restart, Replay and Poison (EWSS-32)

# Runs the EWSS-18 cases RS-10, RS-04, RS-01 and RS-08 against a deployed
# environment and keeps the evidence. reconcile=api (the default) runs on a
# hosted runner and reconciles through the public API; reconcile=sql runs on
# the VNet runner and reads MySQL directly. It restarts container app revisions
# and adds tagged test batches, so run it only in an agreed window.
#
# A workflow_dispatch workflow must exist on the default branch before it can
# be started by hand. Until it is merged, push to the feature branch with
# "[run-ewss-32]" in the commit message to run it once.
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to test'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stg
          - dev
      cases:
        description: 'Comma-separated EWSS-18 cases (RS-10, RS-04, RS-01, RS-08)'
        required: false
        default: 'RS-10,RS-04,RS-01,RS-08'
      reconcile:
        description: 'api = reconcile through the public API on a hosted runner; sql = read private MySQL from the VNet runner'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - sql
  push:
    branches: [feature/EWSS-32-resilience-tests]
    paths:
      - 'scripts/resilience/**'
      - '.github/workflows/resilience-tests.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: resilience-tests
  cancel-in-progress: false

jobs:
  # The self-hosted runner has no gh CLI, so check for active runs on a hosted runner.
  guard:
    name: Refuse to Run During a Deployment
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-ewss-32')
    runs-on: ubuntu-latest
    steps:
      - name: Check for Active Deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for wf in "CD - Multi-Environment Deployment & Evidence Pipeline" \
                    "Database - Liquibase Migration" \
                    "IaC - Create Cloud Resources (Dev, Stg, Prod)"; do
            ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 20 \
              --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::'$wf' has $ACTIVE active run(s). Restarting replicas now would collide with it."
              exit 1
            fi
          done
          echo "No deployment, migration or Terraform run is active."

  resilience:
    name: EWSS-32 Resilience (${{ inputs.target_env || 'prod' }})
    needs: [guard]
    # SQL reconciliation needs the VNet runner (MySQL is private); API reconciliation runs anywhere.
    runs-on: ${{ (inputs.reconcile || 'api') == 'sql' && fromJSON(format('["self-hosted","azure-vnet","{0}"]', inputs.target_env || 'prod')) || 'ubuntu-latest' }}
    environment: ${{ inputs.target_env || 'prod' }}
    timeout-minutes: 45
    env:
      TARGET_ENV: ${{ inputs.target_env || 'prod' }}
      RESOURCE_GROUP: rg-ewastescalable-${{ inputs.target_env || 'prod' }}
      CASES: ${{ inputs.cases || 'RS-10,RS-04,RS-01,RS-08' }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      RECONCILE: ${{ inputs.reconcile || 'api' }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve Cases
        # On a push run, "[run-ewss-32 cases=RS-10,RS-04]" limits the cases.
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" =~ \[run-ewss-32\ cases=([A-Za-z0-9,-]+)\] ]]; then
            echo "CASES=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "Cases from the commit message: ${BASH_REMATCH[1]}"
          else
            echo "Cases: $CASES"
          fi

      - name: Authenticate to Microsoft Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Endpoint and Event Hubs Connection
        run: |
          set -euo pipefail
          UI_FQDN=$(az containerapp show --name "aca-ewastescalable-${TARGET_ENV}-ui" \
            --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          CONNECTION=$(az eventhubs namespace authorization-rule keys list \
            --resource-group "$RESOURCE_GROUP" --namespace-name "evh-ewastescalable-${TARGET_ENV}" \
            --name auth-ewastescalable-workload --query primaryConnectionString -o tsv)
          echo "::add-mask::$CONNECTION"
          [ -n "$UI_FQDN" ] && [ -n "$CONNECTION" ] || { echo "::error::Could not resolve the UI endpoint or Event Hubs connection."; exit 1; }
          {
            echo "BASE_URL=https://${UI_FQDN}"
            echo "EVH_CONNECTION_STRING=${CONNECTION}"
          } >> "$GITHUB_ENV"
          echo "Testing through https://${UI_FQDN}"

      - name: Setup Python Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Harness Dependencies
        run: python -m pip install --quiet -r scripts/resilience/requirements.txt

      - name: Run Restart, Replay and Poison Cases
        env:
          MYSQL_HOST: mysql-ewastescalable-${{ inputs.target_env || 'prod' }}.mysql.database.azure.com
          MYSQL_DB: ewastescalabledb
          MYSQL_USER: ewasteadmin
          MYSQL_PASSWORD: ${{ secrets.MYSQL_DB_ADMIN_PASSWORD }}
          # Same synthetic seed account and fallback as the CD smoke test (database/README.md).
          DONOR_EMAIL: donor1@ewaste.test
          DONOR_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || 'TestOnly#2026!' }}
          AUDITOR_EMAIL: auditor@ewaste.test
          RUN_ID: r${{ github.run_id }}
        run: python scripts/resilience/ewss32.py --cases "$CASES" --reconcile "$RECONCILE" --run-id "$RUN_ID" --out artifacts/ewss-32

      - name: Publish Run Summary
        if: always()
        run: |
          SUMMARY=$(find artifacts/ewss-32 -name summary.md 2>/dev/null | head -n1 || true)
          if [ -n "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; else echo "No summary was produced." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Retain Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ewss-32-evidence-${{ github.run_id }}
          path: artifacts/ewss-32
          retention-days: 90
          if-no-files-found: warn
