name: "Terraform - Break Azure State Lock"

on:
  workflow_dispatch:
    inputs:
      storage_account:
        description: 'Azure Storage Account Name'
        required: true
        type: string
      container_name:
        description: 'Blob Container Name'
        required: true
        type: string
      blob_name:
        description: 'Blob Name (e.g., dev.tfstate)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  break-lock:
    name: Break Blob Lease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to Azure using Service Principal Secrets or OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Break the stuck blob lease without requiring a Lock ID
      - name: Break Lease
        uses: azure/cli@v2
        with:
          inlineScript: |
            STORAGE_ACCOUNT="${{ inputs.storage_account || secrets.TF_STATE_STORAGE_ACCOUNT || 'ewastetfstatese' }}"
            CONTAINER_NAME="${{ inputs.container_name || 'tfstate' }}"
            BLOB_NAME="${{ inputs.blob_name || 'dev.tfstate' }}"

            echo "Attempting to break lease on: $BLOB_NAME in $STORAGE_ACCOUNT/$CONTAINER_NAME"

            if [ -n "${{ secrets.TF_STATE_SA_ACCESS_KEY }}" ]; then
              az storage blob lease break \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$CONTAINER_NAME" \
                --blob-name "$BLOB_NAME" \
                --account-key "${{ secrets.TF_STATE_SA_ACCESS_KEY }}"
            else
              az storage blob lease break \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$CONTAINER_NAME" \
                --blob-name "$BLOB_NAME" \
                --auth-mode login
            fi
            echo "Lease broken successfully!"
